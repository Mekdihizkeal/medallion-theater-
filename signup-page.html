<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medallion Theatre Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="signup-page.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="panel signup-panel" id="signupSection">
        <a href="index.html" class="top-logo" id="topLogoLink">
          <img src="images/signup-logo-top.png" alt="The Medallion Theatre logo" />
        </a>

        <a href="login-page.html" class="login-link" id="loginLinkBtn">
          <span class="login-link-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="3.5" />
              <path d="M5 19c.9-3.1 3.6-4.8 7-4.8s6.1 1.7 7 4.8" />
            </svg>
          </span>
          <span>Login</span>
        </a>

        <div class="left-shape" aria-hidden="true"></div>
        <div class="right-leaf" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="bottom-curve" aria-hidden="true"></div>

        <form class="signup-card" id="signupForm">
          <h1>Create Your Account</h1>
          <p class="subtitle">Join our community and start your journey.</p>
          <div class="ornament" aria-hidden="true">
            <span></span>
            <i></i>
            <span></span>
          </div>

          <label class="field">
            <span class="field-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="8" r="3.4" />
                <path d="M5 19c.9-3 3.5-4.7 7-4.7s6.1 1.7 7 4.7" />
              </svg>
            </span>
            <input type="text" id="firstName" placeholder="First Name" />
          </label>

          <label class="field">
            <span class="field-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="8" r="3.4" />
                <path d="M5 19c.9-3 3.5-4.7 7-4.7s6.1 1.7 7 4.7" />
              </svg>
            </span>
            <input type="text" id="lastName" placeholder="Last Name" />
          </label>

          <label class="field">
            <span class="field-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="2" />
                <path d="m4 7 8 6 8-6" />
              </svg>
            </span>
            <input type="email" id="emailAddress" placeholder="Email Address" />
          </label>

          <div class="gender-row">
            <span class="gender-label">Sex</span>
            <label class="radio-option">
              <input type="radio" name="sex" value="Male" checked />
              <span>Male</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="sex" value="Female" />
              <span>Female</span>
            </label>
          </div>

          <label class="field">
            <span class="field-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 5a3 3 0 0 1 5 3l-2 2a3 3 0 0 1-4.2 0 3 3 0 0 1 0-4.2L9 3.6" />
                <path d="M17 19a3 3 0 0 1-5-3l2-2a3 3 0 0 1 4.2 0 3 3 0 0 1 0 4.2L15 20.4" />
              </svg>
            </span>
            <input type="tel" id="phoneNumber" placeholder="Phone Number" />
          </label>

          <label class="field">
            <span class="field-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 20s6-5.2 6-10a6 6 0 1 0-12 0c0 4.8 6 10 6 10Z" />
                <circle cx="12" cy="10" r="2.1" />
              </svg>
            </span>
            <input type="text" id="streetAddress" placeholder="Street Address" />
          </label>

          <label class="field">
            <span class="field-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 20h12M8 20V6h8v14M10 6V4h4v2M11 10h1m-1 3h1m-1 3h1m2-6h1m-1 3h1m-1 3h1" />
              </svg>
            </span>
            <input type="text" id="city" placeholder="City" />
          </label>

          <div class="field-split">
            <label class="field">
              <span class="field-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M6 20h12M8 20V6h8v14M10 6V4h4v2M11 10h1m-1 3h1m-1 3h1m2-6h1m-1 3h1m-1 3h1" />
                </svg>
              </span>
              <input type="text" id="state" placeholder="State" />
            </label>

            <label class="field">
              <span class="field-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 20s6-5.2 6-10a6 6 0 1 0-12 0c0 4.8 6 10 6 10Z" />
                  <circle cx="12" cy="10" r="2.1" />
                </svg>
              </span>
              <input type="text" id="zipCode" placeholder="Zip" />
            </label>
          </div>

          <label class="field">
            <span class="field-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="5" y="10" width="14" height="10" rx="2" />
                <path d="M8 10V8a4 4 0 1 1 8 0v2" />
              </svg>
            </span>
            <input type="password" id="password" placeholder="Password" />
            <button type="button" class="eye-btn" data-target="password" aria-label="Show password">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z" />
                <circle cx="12" cy="12" r="2.8" />
              </svg>
            </button>
          </label>

          <label class="field">
            <span class="field-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="5" y="10" width="14" height="10" rx="2" />
                <path d="M8 10V8a4 4 0 1 1 8 0v2" />
              </svg>
            </span>
            <input type="password" id="confirmPassword" placeholder="Confirm Password" />
            <button type="button" class="eye-btn" data-target="confirmPassword" aria-label="Show confirm password">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z" />
                <circle cx="12" cy="12" r="2.8" />
              </svg>
            </button>
          </label>

          <button type="submit" class="signup-btn">Sign Up</button>

          <div class="bottom-login">
            <span>Already have an account?</span>
            <a href="login-page.html" class="inline-login" id="inlineLoginBtn">Login</a>
          </div>
        </form>

        <footer class="footer-links">
          <button type="button" class="footer-link">Privacy Policy</button>
          <span class="divider"></span>
          <button type="button" class="footer-link">Terms and Conditions</button>
          <span class="divider"></span>
          <button type="button" class="footer-link">About Us</button>
        </footer>
      </section>
    </main>

    <div class="toast" id="toast" hidden></div>

    <script src="signup-page.js"></script>
  </body>
</html>
