<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Verification Report</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="tickets-page.css" />
</head>
<body>
     <main class="tickets-shell">
      <section class="report-panel">
        <div class="leaf-left" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>

        <article class="report-card">
          <div class="report-banner">
            <img src="images/medallion-logo.png" alt="Medallion report" />
            <h2>Ticket Verification Report</h2>
          </div>

          <article class="patron-block">
            <div class="patron-head">
              <span>Patron</span>
              <span>Sam Green</span>
            </div>
            <div class="patron-meta">
              <div><span>Performance</span><span>Dear England</span></div>
              <div><span>Seats</span><span>H1, H2, H3</span></div>
            </div>
          </article>

          <article class="patron-block">
            <div class="patron-head">
              <span>Patron</span>
              <span>Ava Reed</span>
            </div>
            <div class="patron-meta">
              <div><span>Performance</span><span>Macbeth</span></div>
              <div><span>Seats</span><span>D4, D5</span></div>
            </div>
          </article>

          <article class="patron-block">
            <div class="patron-head">
              <span>Patron</span>
              <span>Leo Brooks</span>
            </div>
            <div class="patron-meta">
              <div><span>Performance</span><span>Rabbit Hole</span></div>
              <div><span>Seats</span><span>G5, G6</span></div>
            </div>
          </article>
        </article>
      </section> 
</body>
</html>
