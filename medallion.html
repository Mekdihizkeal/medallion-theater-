<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Medallion Theatre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="medallion.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="panel booking-panel" id="bookingSection">
        <header class="topbar">
          <a class="brand" href="index.html" aria-label="The Medallion Theatre">
            <img src="images/medallion-logo.png" alt="The Medallion Theatre logo" />
          </a>

          <nav class="main-nav" aria-label="Primary">
            <a href="#bookingSection" class="nav-link" data-nav-target="bookingSection">
              <span class="icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M4.5 10.5 8 7l3 2.5 5-5 3.5 3.5-5 5 2.5 3-3.5 3.5-2.5-3-5 1.5-2-2 1.5-5-3-2.5Z"
                  />
                </svg>
              </span>
              <span>PLAYS</span>
            </a>
            <a href="tickets-page.html" class="nav-link">
              <span class="icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M7 3v3M17 3v3M4 8h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z" />
                </svg>
              </span>
              <span>TICKETS</span>
            </a>
            <a href="index.html" class="nav-link">
              <span class="icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M7 4h10a1 1 0 0 1 1 1v15l-6-3-6 3V5a1 1 0 0 1 1-1Z" />
                </svg>
              </span>
              <span>MOVIES</span>
            </a>
          </nav>

          <div class="toolbar">
            <span class="hello">Hi, Sam!</span>
            <button class="circle-btn profile-btn" type="button" aria-label="Profile" id="profileBtn">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="8" r="3.2" />
                <path d="M5 19c.9-3 3.6-4.7 7-4.7s6.1 1.7 7 4.7" />
              </svg>
            </button>
            <div class="profile-menu" id="profileMenu" hidden>
              <a href="login-page.html#dashboardSection" class="profile-menu-item" data-profile-action="account">My Account</a>
              <a href="tickets-page.html" class="profile-menu-item" data-profile-action="tickets">My Tickets</a>
              <a href="login-page.html" class="profile-menu-item" data-profile-action="logout">Log Out</a>
            </div>
          </div>
        </header>

        <div class="booking-grid">
          <section class="movie-column">
            <div class="section-heading">
              <h1>THE MEDALLION THEATRE</h1>
              <div class="ornament" aria-hidden="true">
                <span></span>
                <i></i>
                <span></span>
              </div>
            </div>

            <div class="movie-card">
              <img class="poster" id="moviePoster" src="images/poster.png" alt="Dear England poster" />

              <div class="movie-side">
                <article class="show-card">
                  <h2 id="movieTitle">Dear England</h2>
                  <p class="meta">
                    <span class="meta-clock">
                      <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="9" />
                        <path d="M12 7v5l3 2" />
                      </svg>
                    </span>
                    2h 10min
                    <span class="dot">&middot;</span>
                    2024
                    <span class="dot">&middot;</span>
                    Movie
                  </p>
                </article>

                <article class="selected-card">
                  <h3>Your Selected Seats</h3>
                  <p class="seat-count"><span id="seatCount">3</span> Seats</p>

                  <div class="selected-seat-tags" id="selectedSeatTags">
                    <button type="button" class="seat-pill active" data-seat="H1">H1</button>
                    <button type="button" class="seat-pill active" data-seat="H2">H2</button>
                    <button type="button" class="seat-pill active" data-seat="H3">H3</button>
                  </div>

                  <div class="total-row">
                    <span>Total</span>
                    <strong id="totalPrice">$300</strong>
                  </div>

                  <div class="actions">
                    <button class="action-btn action-btn-primary" type="button" id="purchaseBtn">Proceed To Ticket</button>
                  </div>
                </article>
              </div>
            </div>
          </section>

          <section class="schedule-column">
            <div class="date-block">
              <h2>Choose The Date</h2>
              <div class="date-row">
                <button type="button" class="date-card">
                  <span>JAN</span>
                  <strong>05</strong>
                  <small>SUN</small>
                </button>
                <button type="button" class="date-card">
                  <span>JAN</span>
                  <strong>06</strong>
                  <small>MON</small>
                </button>
                <button type="button" class="date-card active">
                  <span>JAN</span>
                  <strong>07</strong>
                  <small>TUE</small>
                </button>
                <button type="button" class="date-card">
                  <span>JAN</span>
                  <strong>08</strong>
                  <small>WED</small>
                </button>
                <button type="button" class="date-card">
                  <span>JAN</span>
                  <strong>09</strong>
                  <small>THU</small>
                </button>
                <button type="button" class="arrow-btn" aria-label="Next date" id="nextDateBtn">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m9 5 7 7-7 7" />
                  </svg>
                </button>
              </div>
            </div>

              <div class="seat-section">
              <h2>Choose your seat</h2>
              <div class="seat-layout-wrap">
                <div class="seat-board">
                  <div class="stage">STAGE</div>
                  <div class="seat-layout">
                    <div class="box-col" id="leftBoxCol">
                      <span class="box-col-title">BOX<br>1–8</span>
                      <div class="box-col-seats" id="leftBoxSeats"></div>
                    </div>
                    <div class="seats" id="seats"></div>
                    <div class="box-col" id="rightBoxCol">
                      <span class="box-col-title">BOX<br>9–16</span>
                      <div class="box-col-seats" id="rightBoxSeats"></div>
                    </div>
                  </div>
                </div>

                <div class="legend">
                  <div><i class="legend-box orchestra"></i><span>Orchestra · $65</span></div>
                  <div><i class="legend-box mezzanine"></i><span>Mezzanine · $55</span></div>
                  <div><i class="legend-box balcony"></i><span>Balcony · $40</span></div>
                  <div><i class="legend-box box-seat"></i><span>Box · $85</span></div>
                  <div><i class="legend-box selected"></i><span>Selected</span></div>
                  <div><i class="legend-box unavailable"></i><span>Unavailable</span></div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </section>

    </main>

    <div class="toast" id="toast" hidden></div>

    <script src="medallion.js"></script>
  </body>
</html>
