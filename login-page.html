<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medallion Theatre Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="login-page.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="panel hero-panel" id="loginSection">
        <div class="hero-topbar">
          <a href="index.html" class="hero-logo" id="heroLogoLink">
            <img src="images/login-logo-top.png" alt="The Medallion Theatre logo" />
          </a>

          <nav class="hero-nav">
            <a href="medallion.html" class="nav-link">
              <span class="nav-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M7 3v3M17 3v3M4 8h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z" />
                </svg>
              </span>
              <span>BOOKING</span>
            </a>
            <a href="medallion.html" class="nav-link">
              <span class="nav-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="12" r="8" />
                  <path d="M12 7v5l3 2" />
                </svg>
              </span>
              <span>SCHEDULE</span>
            </a>
            <a href="medallion.html" class="nav-link">
              <span class="nav-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 20s6-5.2 6-10a6 6 0 1 0-12 0c0 4.8 6 10 6 10Z" />
                  <circle cx="12" cy="10" r="2.2" />
                </svg>
              </span>
              <span>LOCATION</span>
            </a>
            <button type="button" class="login-nav-btn" id="navLoginBtn">LOGIN</button>
          </nav>
        </div>

        <div class="hero-stage">
          <div class="shape-left" aria-hidden="true">
            <div class="social-row">
              <button type="button" class="social-btn" aria-label="Facebook">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M13.5 20v-7h2.4l.4-3h-2.8V8.1c0-.9.3-1.5 1.6-1.5H16V4.1c-.3 0-.9-.1-1.8-.1-2.5 0-4.1 1.5-4.1 4.3V10H8v3h2.1v7Z" />
                </svg>
              </button>
              <button type="button" class="social-btn" aria-label="Twitter">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M20 7.2c-.6.3-1.3.5-2 .6.7-.4 1.2-1 1.5-1.8-.7.4-1.5.7-2.3.9A3.4 3.4 0 0 0 11.4 10c0 .3 0 .5.1.8A9.6 9.6 0 0 1 4.5 7.3c-.3.5-.5 1-.5 1.7 0 1.2.6 2.2 1.5 2.8-.6 0-1.1-.2-1.6-.4 0 1.7 1.2 3.1 2.8 3.4-.3.1-.7.1-1 .1-.2 0-.5 0-.7-.1.5 1.4 1.8 2.4 3.3 2.4A6.8 6.8 0 0 1 4 18.6 9.5 9.5 0 0 0 9.2 20c6.2 0 9.6-5.1 9.6-9.6v-.4c.7-.5 1.2-1 1.7-1.8Z" />
                </svg>
              </button>
              <button type="button" class="social-btn" aria-label="Instagram">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="4" y="4" width="16" height="16" rx="4" />
                  <circle cx="12" cy="12" r="3.5" />
                  <circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none" />
                </svg>
              </button>
            </div>
          </div>

          <form class="login-card" id="loginForm">
            <div class="login-badge">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="5" y="10" width="14" height="10" rx="2" />
                <path d="M8 10V8a4 4 0 1 1 8 0v2" />
                <path d="M12 13v3" />
              </svg>
            </div>

            <h1>Log In</h1>
            <div class="ornament" aria-hidden="true">
              <span></span>
              <i></i>
              <span></span>
            </div>

            <label class="field">
              <span class="field-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="5" width="18" height="14" rx="2" />
                  <path d="m4 7 8 6 8-6" />
                </svg>
              </span>
              <input type="email" id="emailInput" placeholder="Email" />
            </label>

            <label class="field">
              <span class="field-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="5" y="10" width="14" height="10" rx="2" />
                  <path d="M8 10V8a4 4 0 1 1 8 0v2" />
                </svg>
              </span>
              <input type="password" id="passwordInput" placeholder="Password" />
              <button type="button" class="eye-btn" id="togglePassword" aria-label="Show password">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z" />
                  <circle cx="12" cy="12" r="2.8" />
                </svg>
              </button>
            </label>

            <button type="button" class="link-btn forgot-btn" id="forgotBtn">Forgot Password?</button>

            <div class="login-actions">
              <span>Don't have an account?</span>
              <a href="signup-page.html" class="link-btn signup-btn" id="signupBtn">Sign Up</a>
            </div>
          </form>

          <div class="leaf-art" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" hidden></div>

    <script src="login-page.js?v=2"></script>
  </body>
</html>
