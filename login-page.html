<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medallion Theatre Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="login-page.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="panel hero-panel" id="loginSection">
        <div class="hero-topbar">
          <a href="index.html" class="hero-logo" id="heroLogoLink">
            <img src="images/login-logo-top.png" alt="The Medallion Theatre logo" />
          </a>

          <nav class="hero-nav">
            <a href="medallion.html" class="nav-link">
              <span class="nav-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M7 3v3M17 3v3M4 8h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z" />
                </svg>
              </span>
              <span>BOOKING</span>
            </a>
            <a href="medallion.html" class="nav-link">
              <span class="nav-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="12" r="8" />
                  <path d="M12 7v5l3 2" />
                </svg>
              </span>
              <span>SCHEDULE</span>
            </a>
            <a href="medallion.html" class="nav-link">
              <span class="nav-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 20s6-5.2 6-10a6 6 0 1 0-12 0c0 4.8 6 10 6 10Z" />
                  <circle cx="12" cy="10" r="2.2" />
                </svg>
              </span>
              <span>LOCATION</span>
            </a>
            <a href="#loginSection" class="login-nav-btn" id="navLoginBtn">LOGIN</a>
          </nav>
        </div>

        <div class="hero-stage">
          <div class="shape-left" aria-hidden="true">
            <div class="social-row">
              <button type="button" class="social-btn" aria-label="Facebook">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M13.5 20v-7h2.4l.4-3h-2.8V8.1c0-.9.3-1.5 1.6-1.5H16V4.1c-.3 0-.9-.1-1.8-.1-2.5 0-4.1 1.5-4.1 4.3V10H8v3h2.1v7Z" />
                </svg>
              </button>
              <button type="button" class="social-btn" aria-label="Twitter">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M20 7.2c-.6.3-1.3.5-2 .6.7-.4 1.2-1 1.5-1.8-.7.4-1.5.7-2.3.9A3.4 3.4 0 0 0 11.4 10c0 .3 0 .5.1.8A9.6 9.6 0 0 1 4.5 7.3c-.3.5-.5 1-.5 1.7 0 1.2.6 2.2 1.5 2.8-.6 0-1.1-.2-1.6-.4 0 1.7 1.2 3.1 2.8 3.4-.3.1-.7.1-1 .1-.2 0-.5 0-.7-.1.5 1.4 1.8 2.4 3.3 2.4A6.8 6.8 0 0 1 4 18.6 9.5 9.5 0 0 0 9.2 20c6.2 0 9.6-5.1 9.6-9.6v-.4c.7-.5 1.2-1 1.7-1.8Z" />
                </svg>
              </button>
              <button type="button" class="social-btn" aria-label="Instagram">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="4" y="4" width="16" height="16" rx="4" />
                  <circle cx="12" cy="12" r="3.5" />
                  <circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none" />
                </svg>
              </button>
            </div>
          </div>

          <form class="login-card" id="loginForm">
            <div class="login-badge">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="5" y="10" width="14" height="10" rx="2" />
                <path d="M8 10V8a4 4 0 1 1 8 0v2" />
                <path d="M12 13v3" />
              </svg>
            </div>

            <h1>Log In</h1>
            <div class="ornament" aria-hidden="true">
              <span></span>
              <i></i>
              <span></span>
            </div>

            <label class="field">
              <span class="field-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="5" width="18" height="14" rx="2" />
                  <path d="m4 7 8 6 8-6" />
                </svg>
              </span>
              <input type="email" id="emailInput" placeholder="Email" />
            </label>

            <label class="field">
              <span class="field-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="5" y="10" width="14" height="10" rx="2" />
                  <path d="M8 10V8a4 4 0 1 1 8 0v2" />
                </svg>
              </span>
              <input type="password" id="passwordInput" placeholder="Password" />
              <button type="button" class="eye-btn" id="togglePassword" aria-label="Show password">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z" />
                  <circle cx="12" cy="12" r="2.8" />
                </svg>
              </button>
            </label>

            <button type="button" class="link-btn forgot-btn" id="forgotBtn">Forgot Password?</button>

            <div class="login-actions">
              <span>Don't have an account?</span>
              <a href="signup-page.html" class="link-btn signup-btn" id="signupBtn">Sign Up</a>
            </div>
          </form>

          <div class="leaf-art" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </section>

      <section class="panel dashboard-panel" id="dashboardSection">
        <aside class="sidebar">
          <img class="sidebar-logo" src="images/login-logo-side.png" alt="Medallion Theatre logo" />
          <div class="avatar">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 21c1.2-4 4.2-6 8-6s6.8 2 8 6" />
            </svg>
          </div>
          <h2>Admin</h2>

          <div class="sidebar-menu">
            <button type="button" class="menu-btn active" data-section="dashboard">
              <span class="menu-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 12.5 12 5l8 7.5" />
                  <path d="M6 11.5V19h12v-7.5" />
                  <path d="M10 19v-4h4v4" />
                </svg>
              </span>
              <span>Dashboard</span>
            </button>
            <button type="button" class="menu-link" data-section="add-movies">
              <span class="menu-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 5v14M5 12h14" />
                </svg>
              </span>
              <span>Add Movies</span>
            </button>
            <button type="button" class="menu-link" data-section="available-movies">
              <span class="menu-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="12" r="8.5" />
                  <path d="m10 8 6 4-6 4Z" />
                </svg>
              </span>
              <span>Available Movies</span>
            </button>
            <button type="button" class="menu-link" data-section="edit-screening">
              <span class="menu-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M6 5h12M6 12h12M6 19h12" />
                  <circle cx="4" cy="5" r="1" fill="currentColor" stroke="none" />
                  <circle cx="4" cy="12" r="1" fill="currentColor" stroke="none" />
                  <circle cx="4" cy="19" r="1" fill="currentColor" stroke="none" />
                </svg>
              </span>
              <span>Edit Screening</span>
            </button>
            <button type="button" class="menu-link" data-section="customers">
              <span class="menu-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="9" cy="9" r="2.4" />
                  <circle cx="16.5" cy="10" r="2" />
                  <path d="M4.5 19c.9-2.8 3.2-4.3 6.2-4.3s5.3 1.5 6.2 4.3M14 18.8c.5-1.8 1.8-2.8 3.7-2.8 1.8 0 3.1 1 3.7 2.8" />
                </svg>
              </span>
              <span>Customers</span>
            </button>
          </div>

          <a href="login-page.html" class="signout-btn" id="signoutBtn">
            <span class="menu-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M10 7H6a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h4" />
                <path d="m13 16 4-4-4-4" />
                <path d="M17 12H9" />
              </svg>
            </span>
            <span>Sign Out</span>
          </a>
        </aside>

        <div class="dashboard-main">
          <div class="dashboard-topbar">
            <img class="center-logo" src="images/login-logo-center.png" alt="Medallion Theatre logo" />
            <button type="button" class="bell-btn" id="bellBtn" aria-label="Notifications">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 16h12l-1.2-1.6a4 4 0 0 1-.8-2.4V10a4 4 0 1 0-8 0v2a4 4 0 0 1-.8 2.4Z" />
                <path d="M10 18a2 2 0 0 0 4 0" />
              </svg>
              <span class="bell-badge" id="bellBadge">3</span>
            </button>
          </div>

          <div class="dashboard-title">
            <h1 id="dashboardHeading">THE MEDALLION THEATRE</h1>
            <div class="ornament" aria-hidden="true">
              <span></span>
              <i></i>
              <span></span>
            </div>
          </div>

          <div class="stat-row">
            <button type="button" class="stat-card" id="statCardLeft">
              <span class="stat-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m4 10 10-6 6 4-10 6Z" />
                  <path d="m4 10 0 6 10 6 0-6" />
                  <path d="m20 8 0 6-6 4" />
                </svg>
              </span>
              <div>
                <p id="statLabelLeft">TOTAL SOLD TICKET</p>
              </div>
              <strong id="statValueLeft">9</strong>
            </button>

            <button type="button" class="stat-card" id="statCardRight">
              <span class="stat-icon play-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="12" r="10" />
                  <path d="m10 8 6 4-6 4Z" />
                </svg>
              </span>
              <div>
                <p id="statLabelRight">AVAILABLE MOVIES</p>
              </div>
              <strong id="statValueRight">4</strong>
            </button>
          </div>

          <div class="poster-row">
            <a href="medallion.html" class="poster-btn"><img id="posterOne" src="images/rabbit-hole-card.png" alt="Rabbit Hole poster" /></a>
            <a href="medallion.html" class="poster-btn"><img id="posterTwo" src="images/macbeth-card.png" alt="Macbeth poster" /></a>
            <a href="medallion.html" class="poster-btn"><img id="posterThree" src="images/green-card.png" alt="Green poster" /></a>
          </div>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" hidden></div>

    <script src="login-page.js"></script>
  </body>
</html>
