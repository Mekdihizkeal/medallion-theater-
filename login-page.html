<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medallion Theatre Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="login-page.css" />
  </head>
  <body>
    <main class="page-shell login-shell">
      <section class="panel hero-panel login-hero" id="loginSection">
        <header class="login-topbar">
          <a href="index.html" class="hero-logo" id="heroLogoLink">
            <img src="images/medallion-logo.png" alt="The Medallion Theatre logo" />
          </a>
          <nav class="login-toplinks" aria-label="Login navigation">
            <a href="index.html">Movies</a>
            <a href="signup-page.html">Sign Up</a>
          </nav>
        </header>

        <div class="login-layout">
          <section class="login-copy">
            <p class="eyebrow">Welcome Back</p>
            <h1>Reserve seats, confirm tickets, and keep your movie night moving.</h1>
            <p>Users can log in to continue booking. Admin staff can switch to admin mode and open the management dashboard.</p>
          </section>

          <form class="login-card polished-login-card" id="loginForm">
            <div class="login-badge">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="5" y="10" width="14" height="10" rx="2" />
                <path d="M8 10V8a4 4 0 1 1 8 0v2" />
                <path d="M12 13v3" />
              </svg>
            </div>

            <h2>Log In</h2>
            <div class="login-mode" role="group" aria-label="Login type">
              <button type="button" class="mode-btn active" data-login-role="user">User</button>
              <button type="button" class="mode-btn" data-login-role="admin">Admin</button>
            </div>

            <label class="field">
              <span class="field-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="5" width="18" height="14" rx="2" />
                  <path d="m4 7 8 6 8-6" />
                </svg>
              </span>
              <input type="email" id="emailInput" placeholder="Email" autocomplete="email" />
            </label>

            <label class="field">
              <span class="field-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="5" y="10" width="14" height="10" rx="2" />
                  <path d="M8 10V8a4 4 0 1 1 8 0v2" />
                </svg>
              </span>
              <input type="password" id="passwordInput" placeholder="Password" autocomplete="current-password" />
              <button type="button" class="eye-btn" id="togglePassword" aria-label="Show password">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z" />
                  <circle cx="12" cy="12" r="2.8" />
                </svg>
              </button>
            </label>

            <button type="button" class="link-btn forgot-btn" id="forgotBtn">Forgot Password?</button>
            <button type="submit" class="login-submit-btn">Log In</button>

            <div class="login-actions">
              <span>New user?</span>
              <a href="signup-page.html" class="link-btn signup-btn" id="signupBtn">Create Account</a>
            </div>
          </form>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" hidden></div>
    <script src="login-page.js?v=3"></script>
  </body>
</html>
