<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medallion Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="login-page.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="panel dashboard-panel" id="dashboardSection">
        <aside class="sidebar">
          <a href="index.html" class="brand" aria-label="The Medallion Theatre home">
            <img class="sidebar-logo" src="images/medallion-logo.png" alt="Medallion Theatre logo" />
          </a>
          <div class="avatar">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 21c1.2-4 4.2-6 8-6s6.8 2 8 6" />
            </svg>
          </div>
          <h2>Admin</h2>

          <div class="sidebar-menu">
            <button type="button" class="menu-btn active" data-admin-panel="users">
              <span class="menu-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="9" cy="9" r="2.4" />
                  <circle cx="16.5" cy="10" r="2" />
                  <path d="M4.5 19c.9-2.8 3.2-4.3 6.2-4.3s5.3 1.5 6.2 4.3M14 18.8c.5-1.8 1.8-2.8 3.7-2.8 1.8 0 3.1 1 3.7 2.8" />
                </svg>
              </span>
              <span>Manage Users</span>
            </button>
            <button type="button" class="menu-link" data-admin-panel="shows">
              <span class="menu-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M7 3v3M17 3v3M4 8h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z" />
                </svg>
              </span>
              <span>Manage System</span>
            </button>
            <a href="boxoffice.html" class="menu-link boxoffice-link">
              <span class="menu-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 6h16v12H4Z" />
                  <path d="M8 10h8M8 14h5" />
                </svg>
              </span>
              <span>Open Box Office</span>
            </a>
          </div>

          <a href="login-page.html" class="signout-btn" id="signoutBtn">
            <span class="menu-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M10 7H6a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h4" />
                <path d="m13 16 4-4-4-4" />
                <path d="M17 12H9" />
              </svg>
            </span>
            <span>Sign Out</span>
          </a>
        </aside>

        <div class="dashboard-main admin-main">
          <div class="dashboard-topbar">
            <a href="index.html" aria-label="The Medallion Theatre home">
              <img class="center-logo" src="images/medallion-logo.png" alt="Medallion Theatre logo" />
            </a>
          </div>

          <div class="dashboard-title">
            <h1 id="adminHeading">MANAGE USERS</h1>
            <div class="ornament" aria-hidden="true">
              <span></span><i></i><span></span>
            </div>
          </div>

          <section class="admin-panel-view" data-admin-content="users">
            <div class="admin-toolbar">
              <h2>User Database</h2>
              <button type="button" class="small-action" id="refreshUsersBtn">Pull DB</button>
            </div>
            <div class="admin-table-wrap">
              <table class="admin-table">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Tickets</th>
                  </tr>
                </thead>
                <tbody id="usersTableBody"></tbody>
              </table>
            </div>
          </section>

          <section class="admin-panel-view" data-admin-content="shows" hidden>
            <div class="admin-toolbar">
              <h2>System Management</h2>
              <div class="toolbar-actions">
                <a href="boxoffice.html" class="small-action action-link">Open Box Office</a>
                <button type="button" class="small-action" id="saveSystemBtn">Save System</button>
              </div>
            </div>

            <div class="system-grid">
              <label class="system-card">
                <span>Booking System</span>
                <select id="bookingSystem">
                  <option value="enabled">Enabled</option>
                  <option value="disabled">Disabled</option>
                </select>
              </label>
              <label class="system-card">
                <span>User Sign Up</span>
                <select id="signupSystem">
                  <option value="enabled">Enabled</option>
                  <option value="disabled">Disabled</option>
                </select>
              </label>
              <label class="system-card">
                <span>Bank Payment</span>
                <select id="bankPaymentSystem">
                  <option value="enabled">Enabled</option>
                  <option value="disabled">Disabled</option>
                </select>
              </label>
              <label class="system-card">
                <span>Ticket Verification</span>
                <select id="ticketVerificationSystem">
                  <option value="enabled">Enabled</option>
                  <option value="disabled">Disabled</option>
                </select>
              </label>
              <label class="system-card">
                <span>Maintenance Mode</span>
                <select id="maintenanceSystem">
                  <option value="off">Off</option>
                  <option value="on">On</option>
                </select>
              </label>
              <label class="system-card">
                <span>Active Payment Method</span>
                <select id="paymentSystem">
                  <option value="Bank Transfer">Bank Transfer</option>
                  <option value="Bank Card">Bank Card</option>
                  <option value="Mobile Banking">Mobile Banking</option>
                </select>
              </label>
            </div>

            <div class="admin-report" id="systemStatusReport"></div>
          </section>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" hidden></div>
    <script src="login-page.js"></script>
  </body>
</html>
