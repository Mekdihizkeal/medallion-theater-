<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medallion Theatre Tickets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="tickets-page.css" />
  </head>
  <body>
    <main class="tickets-shell">
      <section class="report-panel">
        <div class="leaf-left" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>

        <div id="reportBox" class="report-card" style="display:none; padding: 24px 28px; max-width: 640px; margin: 40px auto;">
          <h3 style="font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; margin-bottom: 16px; color: var(--ink);">Verification Report</h3>
          <div id="reportContent" style="font-family: Inter, sans-serif; font-size: 0.95rem; line-height: 1.9;"></div>
        </div>

      </section>

      <section class="verify-panel">
        <div class="bg-left" aria-hidden="true"></div>
        <div class="bg-right" aria-hidden="true"></div>
        <div class="sparkle" aria-hidden="true"></div>

        <article class="verify-card">
          <header class="verify-header">
            <a href="index.html" aria-label="Go to home page"><img src="images/login-logo-side.png" alt="Medallion logo" /></a>
            <div>
              <h2>Tickets Verification Screen</h2>
              <p>Reservation Form</p>
              <div class="ornament" aria-hidden="true">
                <span></span><i></i><span></span>
              </div>
            </div>
          </header>

          <form id="verifyForm" class="verify-form">
            <div class="input-row split-two">
              <label class="field">
                <span class="field-icon">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="8" r="3.4" />
                    <path d="M5 19c.9-3 3.5-4.7 7-4.7s6.1 1.7 7 4.7" />
                  </svg>
                </span>
                <input type="text" id="verifyFirstName" placeholder="First Name" />
              </label>
              <label class="field">
                <input type="text" id="verifyLastName" placeholder="Last Name" />
              </label>
            </div>

            <label class="field full">
              <span class="field-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 20s6-5.2 6-10a6 6 0 1 0-12 0c0 4.8 6 10 6 10Z" />
                  <circle cx="12" cy="10" r="2.1" />
                </svg>
              </span>
              <input type="text" id="verifyStreet" placeholder="Street Adress" />
            </label>

            <div class="input-row split-three">
              <label class="field">
                <span class="field-icon">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 20h12M8 20V6h8v14M10 6V4h4v2M11 10h1m-1 3h1m-1 3h1m2-6h1m-1 3h1m-1 3h1" />
                  </svg>
                </span>
                <input type="text" id="verifyCity" placeholder="City" />
              </label>
              <label class="field">
                <span class="field-icon">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 20h12M8 20V6h8v14M10 6V4h4v2M11 10h1m-1 3h1m-1 3h1m2-6h1m-1 3h1m-1 3h1" />
                  </svg>
                </span>
                <input type="text" id="verifyState" placeholder="State" />
              </label>
              <label class="field">
                <span class="field-icon">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 20s6-5.2 6-10a6 6 0 1 0-12 0c0 4.8 6 10 6 10Z" />
                    <circle cx="12" cy="10" r="2.1" />
                  </svg>
                </span>
                <input type="text" id="verifyZip" placeholder="Zip" />
              </label>
            </div>

            <div class="input-row split-two">
              <label class="field">
                <span class="field-icon">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M7 5a3 3 0 0 1 5 3l-2 2a3 3 0 0 1-4.2 0 3 3 0 0 1 0-4.2L9 3.6" />
                    <path d="M17 19a3 3 0 0 1-5-3l2-2a3 3 0 0 1 4.2 0 3 3 0 0 1 0 4.2L15 20.4" />
                  </svg>
                </span>
                <input type="tel" id="verifyPhone" placeholder="Phone Number" />
              </label>
              <label class="field">
                <span class="field-icon">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="14" rx="2" />
                    <path d="m4 7 8 6 8-6" />
                  </svg>
                </span>
                <input type="email" id="verifyEmail" placeholder="Email Address" />
              </label>
            </div>

            <div class="input-row split-three performance-row">
              <label class="field wide">
                <input type="text" id="verifyPerformance" placeholder="Performance" />
              </label>
              <label class="field">
                <input type="text" id="verifyDate" placeholder="Date" />
              </label>
              <label class="field">
                <input type="text" id="verifyTime" placeholder="Time" />
              </label>
            </div>

            <div class="input-row split-three seats-row">
              <label class="field wide">
                <input type="text" id="verifySeats" placeholder="Seats" />
              </label>
            </div>

            <div class="collect-row">
              <span>Total to be Collected</span>
              <input type="text" id="verifyTotal" />
            </div>

            <button type="submit" class="verify-btn">Verify Ticket &#10003;</button>
          </form>
        </article>
      </section>
    </main>

    <div class="toast" id="toast" hidden></div>

    <script src="tickets-page.js"></script>
  </body>
</html>
