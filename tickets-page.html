<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medallion Theatre Tickets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="tickets-page.css" />
  </head>
  <body>
    <main class="tickets-shell">
      <section class="verify-panel">
        <article class="verify-card">
          <header class="verify-header">
            <a href="index.html" aria-label="Go to home page"><img src="images/medallion-logo.png" alt="Medallion logo" /></a>
            <div>
              <h2>Ticket Page</h2>
              <p>Booking and bank payment confirmation</p>
              <div class="ornament" aria-hidden="true">
                <span></span><i></i><span></span>
              </div>
            </div>
          </header>

          <form id="verifyForm" class="verify-form">
            <div class="input-row split-two">
              <label class="field">
                <input type="text" id="verifyFirstName" placeholder="First Name" />
              </label>
              <label class="field">
                <input type="text" id="verifyLastName" placeholder="Last Name" />
              </label>
            </div>

            <div class="input-row split-two">
              <label class="field">
                <input type="tel" id="verifyPhone" placeholder="Phone Number" />
              </label>
              <label class="field">
                <input type="email" id="verifyEmail" placeholder="Email Address" />
              </label>
            </div>

            <div class="input-row split-three performance-row">
              <label class="field wide">
                <input type="text" id="verifyPerformance" placeholder="Movie" />
              </label>
              <label class="field">
                <input type="text" id="verifyDate" placeholder="Date" />
              </label>
              <label class="field">
                <input type="text" id="verifyTime" placeholder="Time" />
              </label>
            </div>

            <div class="input-row split-two">
              <label class="field">
                <input type="text" id="verifySeats" placeholder="Seat Numbers" />
              </label>
              <label class="field">
                <select id="paymentMethod" aria-label="Payment method">
                  <option>Bank Transfer</option>
                  <option>Bank Card</option>
                  <option>Mobile Banking</option>
                </select>
              </label>
            </div>

            <div class="bank-box">
              <strong>Bank Option</strong>
              <span>Bank: Medallion Theatre Bank</span>
              <span>Account: 120-445-8821</span>
              <span>Reference: Use your movie name and seats</span>
            </div>

            <div class="collect-row">
              <span>Total to be Collected</span>
              <input type="text" id="verifyTotal" />
            </div>

            <button type="submit" class="verify-btn">Verify Ticket</button>
          </form>
        </article>
      </section>

      <section id="reportBox" class="report-card">
        <h3>Performance Seat Report</h3>
        <div id="reportContent"></div>
      </section>
    </main>

    <div class="toast" id="toast" hidden></div>
    <script src="reservation-db.js"></script>
    <script src="tickets-page.js"></script>
  </body>
</html>
